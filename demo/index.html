<!doctype html><meta charset=utf-8><title>ODEWeaver</title><style>body{background:#f5f0e5;color:#231f1a;font:15px Georgia,serif;margin:0}.page{max-width:1050px;margin:35px auto;background:#fffdf7;box-shadow:0 8px 40px #0002;padding:45px}.rule{border-top:2px solid #222;margin:20px 0}.coeff{display:grid;grid-template-columns:160px 1fr 90px;gap:12px;align-items:center;margin:12px 0}.bar{height:14px;background:#e6dfd0}.fill{height:100%;background:#333}.eq{font:26px ui-monospace,monospace;background:#f3eee3;padding:20px}input{width:100%}</style><div class=page><small>LAB NOTE 014 / SPARSE DYNAMICS</small><h1>ODEWeaver</h1><div class=rule></div><p>Adjust the sparsity threshold and watch the candidate equation collapse to a compact model.</p><input id=t type=range min=0 max=100 value=35><p>threshold = <b id=tv></b></p><div id=rows></div><div class=eq id=eq></div></div><script>let co=[['1',.012],['x',1.51],['x²',-.748],['x³',.028],['x⁴',-.007]];function d(){let th=+t.value/100*.08;tv.textContent=th.toFixed(3);rows.innerHTML='';let terms=[];co.forEach(([n,c])=>{let keep=Math.abs(c)>=th;rows.innerHTML+=`<div class=coeff><b>${n}</b><div class=bar><div class=fill style="width:${Math.min(100,Math.abs(c)/1.51*100)}%;opacity:${keep?1:.15}"></div></div><span>${keep?c.toFixed(3):'pruned'}</span></div>`;if(keep)terms.push(`${c>0&&terms.length?'+ ':''}${c.toFixed(3)}${n=='1'?'':' '+n}`)});eq.textContent='dx/dt = '+terms.join(' ')}t.oninput=d;d()</script>
